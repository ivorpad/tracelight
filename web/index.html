<!doctype html>
<!-- Tracelight in a browser: served by the bridge (node dist/web/server.js FILE), see docs/WEB.md -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tracelight</title>
<script>
  // what the panel's host normally injects: the Monaco worker and the codicons stylesheet
  window.__tracelight = { workerUri: new URL('/webview/editor.worker.js', location.href).href, codiconsUri: new URL('/webview/codicons/codicon.css', location.href).href };
</script>
<link rel="icon" href="/web/logo.png" />
<link rel="stylesheet" href="/web/app.css" />
</head>
<body>
<header class="pkw-bar">
  <img class="pkw-logo" src="/web/logo.png" alt="" />
  <span class="pkw-brand">Tracelight</span>
  <span id="pkw-file" class="pkw-file"></span>
  <button id="pkw-back" class="pkw-btn" type="button" title="Back to the running file" hidden><i class="codicon codicon-arrow-left"></i></button>
  <span class="pkw-spacer"></span>
  <div class="pkw-presentation" role="group" aria-label="Presentación">
    <button id="pkw-learn" type="button" aria-pressed="true">Aprender</button>
    <button id="pkw-tools" type="button" aria-pressed="false">Depurar</button>
  </div>
  <span id="pkw-webmcp" class="pkw-chip" title="This page offers its Time Machine to an agent in the browser as WebMCP tools (tracelight_state, tracelight_step, tracelight_say, ...)" hidden>WebMCP</span>
  <span id="pkw-runtime" class="pkw-runtime"></span>
  <span id="pkw-status" class="pkw-dot off"></span>
  <button id="pkw-run" class="pkw-btn" type="button" title="Run again"><i class="codicon codicon-play"></i></button>
  <button id="pkw-tm" class="pkw-btn" type="button" title="Time Machine: start at the cursor line, or stop"><i class="codicon codicon-history"></i></button>
  <button id="pkw-debug" class="pkw-btn" type="button" title="Start stepping through code"><i class="codicon codicon-debug-alt"></i><span class="pkw-learn-label">Empezar</span></button>
  <button id="pkw-layout" class="pkw-btn" type="button" title="Code and panel / panel only / code only"><i class="codicon codicon-layout"></i></button>
</header>
<main id="pkw-main">
  <section id="pkw-codecol" aria-label="Code">
    <div id="pkw-code"></div>
    <div id="pkw-debugpane"></div>
  </section>
  <div id="pkw-split" role="separator" aria-orientation="vertical"></div>
  <section id="pkw-panel"><div class="pkw-recording-notice" role="status">Grabación anterior · estos resultados son de otra ejecución.</div><div id="root"></div></section>
</main>
<div id="pkw-notice" class="pkw-notice" role="status" hidden></div>
<div id="pkw-recent" class="pkw-recent" hidden></div>
<script type="module" src="/web/app.js"></script>
</body>
</html>
